[workspace]
resolver = "2"
members = [
    "crates/xmermaid-parser",
    "crates/xmermaid-layout",
    "crates/xmermaid-wasm",
]

[workspace.package]
version = "0.1.9"
edition = "2021"
authors = ["xmermaid contributors"]
license = "MIT"
repository = "https://github.com/your-org/xmermaid"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
