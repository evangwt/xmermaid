<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>xmermaid - Mermaid Diagram Renderer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
    h1 { margin-bottom: 16px; color: #333; }
    .container { max-width: 900px; margin: 0 auto; }
    textarea {
      width: 100%; height: 200px; font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 14px; padding: 12px; border: 1px solid #ddd; border-radius: 8px;
      resize: vertical; background: #fff;
    }
    .controls { margin: 12px 0; display: flex; gap: 8px; align-items: center; }
    button {
      padding: 8px 20px; background: #4a90d9; color: white; border: none;
      border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    button:hover { background: #357abd; }
    select { padding: 6px 12px; border-radius: 6px; border: 1px solid #ddd; font-size: 14px; }
    #output {
      margin-top: 16px; padding: 20px; background: white; border-radius: 8px;
      border: 1px solid #ddd; min-height: 100px; overflow: auto;
    }
    #output svg { max-width: 100%; }
    .error { color: #d32f2f; background: #ffebee; padding: 12px; border-radius: 6px; }
    .examples { margin-top: 16px; }
    .examples button { background: #666; font-size: 12px; padding: 4px 12px; }
    .examples button:hover { background: #555; }
  </style>
</head>
<body>
  <div class="container">
    <h1>xmermaid</h1>
    <textarea id="input">graph TD
  A[Start]-->B{Decision}
  B-->|Yes|C[Process]
  B-->|No|D[End]
  C-->D</textarea>
    <div class="controls">
      <button id="renderBtn">Render</button>
      <select id="themeSelect">
        <option value="default">Default</option>
        <option value="dark">Dark</option>
        <option value="minimal">Minimal</option>
      </select>
    </div>
    <div class="examples">
      <button onclick="loadExample('ci-cd')">CI/CD Pipeline</button>
      <button onclick="loadExample('decision')">Decision Tree</button>
      <button onclick="loadExample('shapes')">Node Shapes</button>
      <button onclick="loadExample('microservices')">Microservices</button>
    </div>
    <div id="output"></div>
  </div>

  <script type="module">
    import { XMermaid, DEFAULT_THEME, DARK_THEME, MINIMAL_THEME } from '../dist/xmermaid.esm.js';

    const themes = { default: DEFAULT_THEME, dark: DARK_THEME, minimal: MINIMAL_THEME };

    document.getElementById('renderBtn').addEventListener('click', async () => {
      const input = document.getElementById('input').value;
      const themeName = document.getElementById('themeSelect').value;
      const output = document.getElementById('output');
      output.innerHTML = '';

      try {
        const xm = new XMermaid({ container: output, theme: themes[themeName] });
        await xm.render(input);
      } catch (e) {
        output.innerHTML = `<div class="error">${e.message}</div>`;
      }
    });

    window.loadExample = function(name) {
      const examples = {
        'ci-cd': `graph LR\n  Code-->Build-->Test-->Deploy`,
        'decision': `graph TD\n  A[Input]-->B{Valid?}\n  B-->|Yes|C[Process]\n  B-->|No|D[Error]\n  C-->E[Output]\n  D-->E`,
        'shapes': `graph TD\n  A[Rectangle]-->B(Rounded)\n  B-->C{Diamond}\n  C-->D((Circle))\n  D-->E[[Subroutine]]\n  E-->F[/Parallelogram/]`,
        'microservices': `graph LR\n  GW[Gateway]-->Auth((Auth))\n  GW-->Order[Order]\n  GW-->User[User]\n  Order-->DB[(Database)]\n  User-->DB\n  Auth-->Cache[(Cache)]`,
      };
      document.getElementById('input').value = examples[name] || '';
    };

    // Auto-render on load
    document.getElementById('renderBtn').click();
  </script>
</body>
</html>
