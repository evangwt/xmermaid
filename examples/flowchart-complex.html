<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>xmermaid - Complex Flowchart</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #f5f5f5; }
    h1 { color: #333; }
    .diagram { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
  </style>
</head>
<body>
  <h1>xmermaid - Complex Flowchart</h1>
  <div id="diagram1" class="diagram"></div>
  <div id="diagram2" class="diagram"></div>

  <script type="module">
    import { XMermaid } from '../dist/xmermaid.esm.js';

    // 15+ nodes with subgraphs, long labels, multi-input/output, and a cycle.
    const xm1 = new XMermaid({ container: document.getElementById('diagram1') });
    await xm1.render(`graph TD
    subgraph Intake [Input Intake]
      A[Receive customer request with a long descriptive label] --> B{Payload schema valid?}
      B -->|No| C[Normalize validation errors]
      C --> D[Send actionable response to client]
      D --> A
      B -->|Yes| E[Enrich request context]
    end

    subgraph Processing [Processing Pipeline]
      E --> F{Existing account found?}
      F -->|Yes| G[Load account preferences]
      F -->|No| H[Create provisional account record]
      G --> I[Queue primary workflow]
      H --> I
      I --> J[Run fraud and compliance checks]
      J --> K{Manual review required?}
      K -->|Yes| L[Assign specialist review task]
      L --> J
      K -->|No| M[Commit workflow results]
    end

    subgraph Notification [Notification Fan-out]
      M --> N[Generate customer summary]
      M --> O[Write audit trail event]
      N --> P[Send email notification]
      N --> Q[Send webhook callback]
      O --> R[Archive immutable evidence bundle]
      P --> S[Done]
      Q --> S
      R --> S
    end`);

    // Flowchart with self-loop and multi-input nodes
    const xm2 = new XMermaid({ container: document.getElementById('diagram2') });
    await xm2.render(`graph TD
    A[Initialize] --> B[Load Config]
    B --> C{Config Valid?}
    C -->|Yes| D[Start Service]
    C -->|No| E[Reset Config]
    E --> B
    D --> F[Process Requests]
    F --> G{Retry?}
    G -->|Yes| F
    G -->|No| H[Shutdown]
    A --> I[Load Plugins]
    I --> D`);
  </script>
</body>
</html>
